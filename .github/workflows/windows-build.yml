name: CarWece - Windows

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Versão exibida
        required: true
        default: '1.6.1'
        type: string
      version_code:
        description: Código de versão (maior que o último já publicado)
        required: true
        default: '12'
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar versão
        shell: pwsh
        run: |
          if ($env:VERSION_NAME -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$') {
            throw "version_name inválida. Exemplo: 1.6.1"
          }
          if ($env:VERSION_CODE -notmatch '^[0-9]{1,10}$' -or [int]$env:VERSION_CODE -lt 1) {
            throw "version_code deve ser um inteiro positivo."
          }

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Habilitar desktop Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Baixar dependências Flutter
        shell: pwsh
        run: flutter pub get

      - name: Compilar Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name="$env:VERSION_NAME" `
            --build-number="$env:VERSION_CODE" `
            --dart-define="CARWECE_VERSION_NAME=$env:VERSION_NAME"

      - name: Preparar pacote para download
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$release/CarWece.exe")) {
            throw "CarWece.exe não foi gerado em $release."
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release/*" `
            -DestinationPath "dist/CarWece-Windows-$env:VERSION_NAME-$env:VERSION_CODE.zip" `
            -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/CarWece-Windows-$env:VERSION_NAME-$env:VERSION_CODE.zip" -Algorithm SHA256).Hash
          "$hash  CarWece-Windows-$env:VERSION_NAME-$env:VERSION_CODE.zip" |
            Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Disponibilizar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: CarWece-Windows
          path: dist/*
          if-no-files-found: error
          compression-level: 0
