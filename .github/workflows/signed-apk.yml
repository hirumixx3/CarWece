name: CarWece - APK assinado

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Versão exibida
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: Código de versão (maior que o último já publicado)
        required: true
        default: '7'
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar versão
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          name, code = os.environ['VERSION_NAME'], os.environ['VERSION_CODE']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?', name):
              raise SystemExit('version_name inválida: use 1.0.0, por exemplo.')
          if not re.fullmatch(r'[0-9]{1,10}', code) or not 1 <= int(code) <= 2100000000:
              raise SystemExit('version_code deve ser um inteiro entre 1 e 2100000000.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Preparar Android SDK
        shell: bash
        run: |
          sdkmanager --licenses < <(yes) >/dev/null
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973'
          chmod +x android/gradlew
      - name: Restaurar chave privada apenas no runner
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 tools/prepare_github_signing.py --directory "$RUNNER_TEMP/carwece-signing"
      - name: Analisar e testar Flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Testar playlists e ciclo de vida nativos
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest --tests com.hirumisu.carwece.MusicDirectorTest --no-daemon --stacktrace
      - name: Compilar APK release assinado
        run: >-
          flutter build apk --release
          --build-name="$VERSION_NAME"
          --build-number="$VERSION_CODE"
          --dart-define="CARWECE_VERSION_NAME=$VERSION_NAME"
      - name: Verificar assinatura, músicas e alinhamento
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          python3 tools/check_apk_signature.py "$RUNNER_TEMP/apk-signature.txt"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          python3 tools/check_apk_music.py "$APK"
          mkdir -p dist
          cp "$APK" "dist/CarWece-${VERSION_NAME}-${VERSION_CODE}-signed.apk"
          cp "$RUNNER_TEMP/apk-signature.txt" dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CarWece-APK-assinado
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Apagar chave temporária
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/carwece-signing"
