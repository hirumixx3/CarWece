name: carwece_graphics
description: Renderizador 3D nativo do CarWece para Windows (Direct3D 11), falando o mesmo canal com.hirumisu.carwece/graphics do renderizador Android.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: CarWeceGraphicsPluginCApi
